services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive
    ports:
      # Localhost only: the dev password is not a secret, so never expose this port.
      - "127.0.0.1:5432:5432"
    volumes:
      - hive-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  hive-pg:
